  // ─── BUILD LYRIC HTML ─────────────────────────────────────────
  function buildLyrics(data, containerId) {
    const container = document.getElementById(containerId);
    data.forEach((line, i) => {
      const div = document.createElement('div');
      div.className = 'lyric-line';
      div.dataset.index = i;
      const t = (line.type || '');
      if (t.includes('spoken')) div.classList.add('spoken');
      if (t.includes('both'))   div.classList.add('both');
      if (t.includes('him') && !t.includes('spoken')) div.classList.add('him');
      if (t.includes('her') && !t.includes('spoken')) div.classList.add('her');
      div.textContent = line.text;
      container.appendChild(div);
    });
  }
  buildLyrics(soloLyrics, 'lyrics-solo');
  buildLyrics(duetLyrics, 'lyrics-duet');

  // ─── KARAOKE SYNC ─────────────────────────────────────────────
  let currentVersion = 'solo';
  const audio = document.getElementById('player');

  function getLyrics() {
    return currentVersion === 'solo' ? soloLyrics : duetLyrics;
  }
  function getLines() {
    return document.querySelectorAll(`#lyrics-${currentVersion} .lyric-line`);
  }

  audio.addEventListener('timeupdate', () => {
    const t = audio.currentTime;
    const lyrics = getLyrics();
    const lines = getLines();
    lines.forEach((el, i) => {
      const start = lyrics[i].time;
      const end = lyrics[i + 1] ? lyrics[i + 1].time : Infinity;
      el.classList.remove('active', 'past');
      if (t >= start && t < end) {
        el.classList.add('active');
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else if (t >= end) {
        el.classList.add('past');
      }
    });
  });

  // ─── VERSION TOGGLE ───────────────────────────────────────────
  function setVersion(v) {
    currentVersion = v;
    document.querySelectorAll('.lyrics-block').forEach(b => b.classList.remove('active'));
    document.getElementById(`lyrics-${v}`).classList.add('active');
    document.querySelectorAll('.v-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    audio.currentTime = 0;
  }
