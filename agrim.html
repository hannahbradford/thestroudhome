<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forever and Ever, Agrim</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --cream: #fdf8f0;
      --gold: #c9a84c;
      --gold-light: #f0d98a;
      --brown: #5c3d2e;
      --text: #3a2a1a;
      --muted: #9b7b4a;
      --hannah: #c2547a;
      --tim: #3d6fa8;
      --both-bg: #f5f0e8;
      --highlight-bg: rgba(201,168,76,0.2);
      --highlight-color: #7a4f1e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--cream); font-family: 'Lato', sans-serif; color: var(--text); min-height: 100vh; }

    /* PASSWORD GATE */
    #gate {
      position: fixed; inset: 0; background: var(--cream);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; z-index: 999; gap: 20px; padding: 32px;
    }
    #gate h1 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--brown); text-align: center; }
    #gate p { color: var(--muted); font-size: 0.95rem; }
    .divider { width: 60px; height: 1px; background: var(--gold-light); }
    #gate-input {
      padding: 12px 20px; border: 1px solid var(--gold); border-radius: 4px;
      font-size: 1rem; background: white; color: var(--text);
      text-align: center; width: 220px; outline: none;
    }
    #gate-input:focus { border-color: var(--brown); }
    #gate-btn {
      padding: 12px 32px; background: var(--gold); color: white;
      border: none; border-radius: 4px; font-size: 1rem; cursor: pointer;
      font-family: 'Lato', sans-serif; letter-spacing: 0.05em; transition: background 150ms;
    }
    #gate-btn:hover { background: var(--brown); }
    #gate-error { color: #c0392b; font-size: 0.85rem; min-height: 1em; }

    /* MAIN */
    #main { display: none; max-width: 680px; margin: 0 auto; padding: 48px 24px 80px; }
    .page-subtitle { text-align: center; color: var(--muted); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
    .page-title { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--brown); text-align: center; margin-bottom: 32px; }

    /* LEGEND (duet only) */
    #legend {
      display: none; justify-content: center; gap: 20px;
      margin-bottom: 24px; flex-wrap: wrap;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text); }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    .legend-dot.hannah { background: var(--hannah); }
    .legend-dot.tim { background: var(--tim); }
    .legend-dot.both { background: var(--gold); }

    /* TOGGLE */
    .version-toggle { display: flex; justify-content: center; gap: 12px; margin-bottom: 32px; }
    .v-btn {
      padding: 8px 24px; border-radius: 20px; border: 1px solid var(--gold);
      background: white; color: var(--brown); cursor: pointer; font-size: 0.85rem;
      transition: all 150ms; font-family: 'Lato', sans-serif;
    }
    .v-btn.active { background: var(--gold); color: white; }

    /* AUDIO */
    .audio-wrap { text-align: center; margin-bottom: 40px; }
    audio { width: 100%; max-width: 420px; accent-color: var(--gold); }
    .audio-note { font-size: 0.75rem; color: var(--muted); margin-top: 8px; }

    /* LYRICS */
    .lyrics-block { display: none; }
    .lyrics-block.active { display: block; }

    .verse-section { margin-top: 36px; }
    .verse-section:first-child { margin-top: 0; }
    .section-label {
      font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 12px; padding-bottom: 6px;
      border-bottom: 1px solid var(--gold-light);
    }

    /* LYRIC LINES */
    .lyric-line {
      font-size: 1.05rem; line-height: 1.95; padding: 3px 10px;
      border-radius: 3px; transition: background 200ms, color 200ms;
      display: flex; align-items: baseline; gap: 10px;
    }
    .lyric-line.spoken { font-style: italic; color: var(--muted); font-size: 0.95rem; }
    .lyric-line.active { background: var(--highlight-bg); color: var(--highlight-color); font-weight: 700; }
    .lyric-line.past { opacity: 0.4; }

    /* SINGER BADGES (duet only) */
    .singer-badge {
      display: inline-block; font-size: 0.62rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 2px 7px; border-radius: 10px; white-space: nowrap;
      flex-shrink: 0; margin-top: 4px;
    }
    .badge-hannah { background: #fceef4; color: var(--hannah); }
    .badge-tim    { background: #e8f0fb; color: var(--tim); }
    .badge-both   { background: #f5f0e0; color: #7a6020; }

    .line-text { flex: 1; }

.photo-wrap { text-align: center; margin-top: 48px; }
.couple-photo {
  width: 100%;
  max-width: 480px;
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  border: 3px solid var(--gold-light);
}

    .footer-note {
      text-align: center; margin-top: 56px; font-size: 0.85rem;
      color: var(--gold); font-family: 'Playfair Display', serif; font-style: italic;
    }
  </style>
</head>
<body>

<!-- PASSWORD GATE -->
<div id="gate">
  <div class="divider"></div>
  <h1>Forever and Ever, Agrim</h1>
  <p>Enter the password to continue</p>
  <input id="gate-input" type="password" placeholder="password"/>
  <button id="gate-btn">Enter</button>
  <div id="gate-error"></div>
  <div class="divider"></div>
</div>

<!-- MAIN PAGE -->
<div id="main">
  <p class="page-subtitle">Happy Anniversary! I love you!!</p>
  <h1 class="page-title">Forever and Ever, Agrim</h1>

  <div class="version-toggle">
    <button class="v-btn active" onclick="setVersion('solo', this)">Solo</button>
    <button class="v-btn" onclick="setVersion('duet', this)">Duet</button>
  </div>

  <div id="legend">
    <div class="legend-item"><div class="legend-dot hannah"></div> Hannah</div>
    <div class="legend-item"><div class="legend-dot tim"></div> Tim</div>
    <div class="legend-item"><div class="legend-dot both"></div> Both</div>
  </div>

  <div class="audio-wrap">
    <audio id="player" controls src="agrim-solo.mp3"></audio>
    <p class="audio-note">Press play and watch the words light up</p>
  </div>

  <div id="lyrics-solo" class="lyrics-block active"></div>
  <div id="lyrics-duet" class="lyrics-block"></div>
  <div class="photo-wrap">
  <img src="ts_hb_pb_2025.jpg" alt="Hannah and Tim" class="couple-photo"/>
</div>
  <p class="footer-note"> I more than love you!</p>
</div>

<script>

  function checkPassword() {
    if (document.getElementById('gate-input').value.trim() === PASSWORD) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('main').style.display = 'block';
    } else {
      document.getElementById('gate-error').textContent = 'Incorrect password - try again';
      document.getElementById('gate-input').value = '';
    }
  }

  // --- LYRICS DATA ---

    {                           time: 53,  text: 'As long as ole grims sit and talk about their hunger' },
    {                           time: 57,  text: 'As long as ole grims sit and talk about ole grims' },
    {                           time: 61,  text: 'If you wonder how long I\'ll be faithful' },
    {                           time: 65,  text: 'My pink belly will tell you again' },
    {                           time: 68,  text: 'I\'m gonna love you forever and ever' },
    {                           time: 72,  text: 'Forever and ever, agrim' },

    { section: 'Spoken',       time: 82,  text: 'Two philosophy majors in love',           type: 'spoken' },
    {                           time: 86,  text: 'Native to Texas and always going mongo',  type: 'spoken' },

    { section: 'Verse 2',      time: 102, text: 'They say that you won\'t find love on a screen' },
    {                           time: 105, text: 'Just two strangers who were swiping away' },
    {                           time: 109, text: 'But honey, a Sunday in spring changed the whole thing' },
    {                           time: 113, text: 'And I\'d swipe right a thousand more days' },

    {                           time: 141, text: 'As long as ole grims sit and talk about their hunger' },
    {                           time: 145, text: 'As long as ole grims sit and talk about ole grims' },
    {                           time: 149, text: 'If you wonder how long I\'ll be faithful' },

    { section: 'Outro',        time: 168, text: 'Oh grimmie, I\'m gonna love you forever and ever...' },
    {                           time: 172, text: 'Forever and ever, forever and ever...' },
    {                           time: 180, text: 'Forever and ever... agrim' },
  ];

  const duetLyrics = [
    { section: 'Spoken Intro', time: 1,   text: '"This one\'s for my Grimbus"',                      type: 'spoken', singer: 'hannah' },
    {                           time: 4,   text: '"My Sweet Baby Grim - lets do this"', type: 'spoken', singer: 'tim' },

    {                           time: 18,  text: 'Your Grim or your Sweet Baby Girl',                 singer: 'hannah' },
    {                           time: 22,  text: 'Grimmie Mungbus Bungus',                            singer: 'hannah' },
    {                           time: 25,  text: 'Every single name means the world',                 singer: 'hannah' },
    {                           time: 30,  text: 'With our Puhhup laid out on the sofa',              singer: 'tim' },
    {                           time: 33,  text: 'Ticklin pink bellies all night',                    singer: 'tim' },
    {                           time: 37,  text: 'Watchin our shows with your head on my shoulder',   singer: 'tim' },
    {                           time: 40,  text: 'Baby, everything feels so right',                   singer: 'tim' },
    { section: 'Chorus',       time: 46,  text: 'Oh baby, I\'m gonna love you forever',              singer: 'both' },

    {                           time: 53,  text: 'As long as ole grims sit and talk about their hunger', singer: 'both' },

    {                           time: 61,  text: 'If you wonder how long I\'ll be faithful',          singer: 'both' },

    {                           time: 68,  text: 'I\'m gonna love you forever and ever',              singer: 'both' },
    {                           time: 72,  text: 'Forever and ever, agrim',                           singer: 'both' },
    { section: 'Spoken',       time: 82,  text: '"We swiped right on a Sunday on Tinder"',           type: 'spoken', singer: 'hannah' },
    {                           time: 86,  text: '"Two philosophy majors in love"',                   type: 'spoken', singer: 'tim' },
    {                           time: 90,  text: '"We skipped Capishe, Puerta, and Oku"',             type: 'spoken', singer: 'hannah' },
    {                           time: 94,  text: '"Cause we know what we like, me and you"',          type: 'spoken', singer: 'tim' },
    { section: 'Verse 2',      time: 102, text: 'They say brunch is the best way to start things',   singer: 'tim' },
    {                           time: 105, text: 'West Kept Secret, you know that\'s our place',      singer: 'tim' },
    {                           time: 109, text: 'Chicken strips and french fries at the Pawtisierie', singer: 'tim' },
    {                           time: 113, text: 'With that big smile spread across your face',       singer: 'tim' },
    {                           time: 117, text: 'Charlotte\'s the home where it all began',          singer: 'hannah' },
    {                           time: 120, text: 'Back to each other, back home again',               singer: 'hannah' },
    {                           time: 124, text: 'We\'re ridin our bikes through the sweetest of cities', singer: 'hannah' },
    {                           time: 128, text: 'Honey, I\'d say our life\'s pretty great',          singer: 'hannah' },
    { section: 'Chorus',       time: 134, text: 'Oh baby, I\'m gonna love you forever',              singer: 'both' },
    {                           time: 138, text: 'Forever and ever, agrim',                           singer: 'both' },
    {                           time: 141, text: 'As long as ole grims sit and talk about their hunger', singer: 'both' },
    {                           time: 145, text: 'As long as ole grims sit and talk about ole grims', singer: 'both' },
    {                           time: 149, text: 'If you wonder how long I\'ll be faithful',          singer: 'both' },
    {                           time: 153, text: 'Well, just listen to how this song ends',           singer: 'both' },
    {                           time: 157, text: 'I\'m gonna love you forever and ever',              singer: 'both' },
    {                           time: 161, text: 'Forever and ever, agrim',                           singer: 'both' },
    { section: 'Outro',        time: 168, text: 'I\'m gonna love you forever and ever...',            singer: 'hannah' },
    {                           time: 172, text: 'Forever and ever, forever and ever...',             singer: 'tim' },
    {                           time: 176, text: 'Honey, Grim, Grimbus...',                           singer: 'both' },
    {                           time: 180, text: 'Forever and ever... agrim',                         singer: 'both' },
  ];

  // --- BUILD LYRIC HTML ---
  function buildLyrics(data, containerId, showBadge) {
    const container = document.getElementById(containerId);
    let currentSection = null;
    let sectionDiv = null;

    data.forEach((line, i) => {
      if (line.section && line.section !== currentSection) {
        currentSection = line.section;
        sectionDiv = document.createElement('div');
        sectionDiv.className = 'verse-section';
        const label = document.createElement('div');
        label.className = 'section-label';
        label.textContent = line.section;
        sectionDiv.appendChild(label);
        container.appendChild(sectionDiv);
      }

      const div = document.createElement('div');
      div.className = 'lyric-line' + (line.type === 'spoken' ? ' spoken' : '');
      div.dataset.index = i;

      if (showBadge && line.singer) {
        const badge = document.createElement('span');
        const label = line.singer === 'hannah' ? 'Hannah' : line.singer === 'tim' ? 'Tim' : 'Both';
        badge.className = `singer-badge badge-${line.singer}`;
        badge.textContent = label;
        div.appendChild(badge);
      }

      const textSpan = document.createElement('span');
      textSpan.className = 'line-text';
      textSpan.textContent = line.text;
      div.appendChild(textSpan);

      (sectionDiv || container).appendChild(div);
    });
  }

  buildLyrics(soloLyrics, 'lyrics-solo', false);
  buildLyrics(duetLyrics, 'lyrics-duet', true);

  // --- KARAOKE SYNC ---
  let currentVersion = 'solo';
  const audio = document.getElementById('player');

  audio.addEventListener('timeupdate', () => {
    const t = audio.currentTime;
    const lyrics = currentVersion === 'solo' ? soloLyrics : duetLyrics;
    const lines = document.querySelectorAll(`#lyrics-${currentVersion} .lyric-line`);
    lines.forEach((el, i) => {
      const start = lyrics[i].time;
      const end = lyrics[i + 1] ? lyrics[i + 1].time : Infinity;
      el.classList.remove('active', 'past');
      if (t >= start && t < end) {
        el.classList.add('active');
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else if (t >= end) {
        el.classList.add('past');
      }
    });
  });

  // --- VERSION TOGGLE ---
  function setVersion(v, btn) {
    currentVersion = v;
    document.querySelectorAll('.lyrics-block').forEach(b => b.classList.remove('active'));
    document.getElementById(`lyrics-${v}`).classList.add('active');
    document.querySelectorAll('.v-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('legend').style.display = v === 'duet' ? 'flex' : 'none';
    audio.src = v === 'solo' ? 'agrim-solo.mp3' : 'agrim-duet.mp3';
    audio.load();
    audio.currentTime = 0;
  }
</script>
</body>
</html>
