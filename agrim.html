    .lyric-line {

<body>

<!-- PASSWORD GATE -->
<div id="gate">

  <div id="gate-error"></div>
</div>

<!-- FOLLOW BUTTON -->
<button id="follow-btn">↓ Follow along</button>

<!-- MAIN PAGE -->
<div id="main">
  <p class="page-subtitle">Happy Anniversary! I love you!!</p>
  <h1 class="page-title">Forever & Ever, Agrim</h1>

  <div class="version-toggle">
    <button class="v-btn active" onclick="setVersion('solo', this)">Solo</button>
    <button class="v-btn" onclick="setVersion('duet', this)">Duet</button>
  </div>

  <div id="legend">
    <div class="legend-item"><div class="legend-dot hannah"></div> Hannah</div>
    <div class="legend-item"><div class="legend-dot tim"></div> Tim</div>
    <div class="legend-item"><div class="legend-dot both"></div> Both</div>
  </div>

  <div class="audio-wrap">
    <audio id="player" controls src="agrim-solo.mp3"></audio>
    <p class="audio-note">Press play and watch the words light up</p>
  </div>

  <div id="lyrics-solo" class="lyrics-block active"></div>
  <div id="lyrics-duet" class="lyrics-block"></div>

  <div class="photo-wrap">
    <img src="Forever & Ever, Agrim.PNG" alt="Hannah and Tim" class="couple-photo"/>
  </div>
  <p class="footer-note">I more than love you!</p>
</div>

  function checkPassword() {
    if (document.getElementById('gate-input').value.trim() === PASSWORD) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('main').style.display = 'block';

    { section: 'Chorus',       time: 46,  text: 'Oh Grimmie, I\'m gonna love you forever' },

    {                           time: 53,  text: 'As long as ole grims sit and talk about their hunger' },

    {                           time: 68,  text: 'I\'m gonna love you forever and ever' },
    {                           time: 72,  text: 'Forever and ever, agrim' },
    { section: 'Spoken',       time: 82,  text: 'Two philosophy majors in love, native to Texas', type: 'spoken' },
    {                           time: 86,  text: 'Always going mongo especially with those bongos', type: 'spoken' },
    { section: 'Verse 2',      time: 102, text: 'They say that you won\'t find love on a screen' },
    {                           time: 105, text: 'Just two strangers who were swiping away' },
    {                           time: 109, text: 'But honey, a Sunday in spring changed the whole thing' },
    {                           time: 113, text: 'And I\'d swipe right a thousand more days' },
    {                           time: 117, text: 'We\'d pass on Capishe and Puerta and Oku' },
    {                           time: 120, text: 'Chicken strips and french fries all the way' },
    {                           time: 124, text: 'Well, from Charlotte to all of the countries we\'ve wandered' },
    {                           time: 128, text: 'Baby, with you is where I want to stay' },
    { section: 'Chorus',       time: 134, text: 'Oh Honey, I\'m gonna love you forever' },
    {                           time: 138, text: 'Forever and ever, agrim' },
    {                           time: 141, text: 'As long as ole grims sit and talk about their hunger' },
    {                           time: 145, text: 'As long as ole grims sit and talk about ole grims' },
    {                           time: 149, text: 'If you wonder how long I\'ll be faithful' },
    {                           time: 153, text: 'My pink belly will tell you again' },
    {                           time: 157, text: 'I\'m gonna love you forever and ever' },

    {                           time: 172, text: 'Forever and ever, forever and ever...' },

  const duetLyrics = [
    { section: "Spoken Intro", time: 1,   text: "\"This one's for my Grimbus\"", type: "spoken", singer: "hannah" },
    {                           time: 3,   text: "\"My Sweet Baby Grim — let's do this\"", type: "spoken", singer: "tim" },
    { section: "Verse 1",      time: 6,   text: "You may call me Grimbus Grombus", singer: "hannah" },
    {                           time: 10,  text: "Your Grim or your Sweet Baby Girl", singer: "hannah" },
    {                           time: 15,  text: "Grimmie Mungbus Bungus", singer: "hannah" },
    {                           time: 25,  text: "Every single name means the world", singer: "hannah" },
    {                           time: 27,  text: "With our Puhhup laid out on the sofa", singer: "tim" },
    {                           time: 33,  text: "Ticklin' pink bellies all night", singer: "tim" },
    {                           time: 37,  text: "Watchin' our shows with your head on my shoulder", singer: "tim" },
    {                           time: 40,  text: "Baby, everything feels so right", singer: "tim" },
    { section: "Chorus",       time: 46,  text: "Oh baby, I'm gonna love you forever", singer: "both" },
    {                           time: 50,  text: "Forever and ever, agrim", singer: "both" },
    {                           time: 53,  text: "As long as ole grims sit and talk about their hunger", singer: "both" },
    {                           time: 57,  text: "As long as ole grims sit and talk about ole grims", singer: "both" },
    {                           time: 61,  text: "If you wonder how long we'll be together", singer: "both" },
    {                           time: 65,  text: "Just look at those pink bellies again", singer: "both" },
    {                           time: 68,  text: "We're gonna love one another forever", singer: "both" },
    {                           time: 72,  text: "Forever and ever, agrim", singer: "both" },
    { section: "Verse 2",      time: 102, text: "They say brunch is the best way to start things", singer: "tim" },
    {                           time: 105, text: "West Kept Secret, you know that's our place", singer: "tim" },
    {                           time: 109, text: "Chicken strips and fries at the Pawtisierie", singer: "tim" },
    {                           time: 113, text: "With that big smile spread across your face", singer: "tim" },
    {                           time: 117, text: "Charlotte's where we started our memories", singer: "hannah" },
    {                           time: 120, text: "And it's always the place we call home", singer: "hannah" },
    {                           time: 124, text: "Well, we stroll Dilworth streets, with our Puhhup at our feet", singer: "hannah" },
    {                           time: 128, text: "Honey, I'd say that our life here together is sweet", singer: "hannah" },
    { section: "Chorus",       time: 134, text: "Oh baby, I'm gonna love you forever", singer: "both" },
    {                           time: 138, text: "Forever and ever, agrim", singer: "both" },
    {                           time: 141, text: "As long as ole grims sit and talk about their hunger", singer: "both" },
    {                           time: 145, text: "As long as ole grims sit and talk about ole grims", singer: "both" },

    { section: "Outro",        time: 176, text: "We're gonna love one another forever...", singer: "hannah" },

  ];

  // --- BUILD LYRIC HTML ---
  function buildLyrics(data, containerId, showBadge) {
    const container = document.getElementById(containerId);
    let currentSection = null;
    let sectionDiv = null;
    data.forEach((line, i) => {
      if (line.section && line.section !== currentSection) {
        currentSection = line.section;
        sectionDiv = document.createElement('div');
        sectionDiv.className = 'verse-section';
        const label = document.createElement('div');
        label.className = 'section-label';
        label.textContent = line.section;
        sectionDiv.appendChild(label);
        container.appendChild(sectionDiv);
      }
      const div = document.createElement('div');
      div.className = 'lyric-line' + (line.type === 'spoken' ? ' spoken' : '');
      div.dataset.index = i;
      if (showBadge && line.singer) {
        const badge = document.createElement('span');
        badge.className = `singer-badge badge-${line.singer}`;
        badge.textContent = line.singer === 'hannah' ? 'Hannah' : line.singer === 'tim' ? 'Tim' : 'Both';
        div.appendChild(badge);
      }
      const textSpan = document.createElement('span');
      textSpan.className = 'line-text';
      textSpan.textContent = line.text;
      div.appendChild(textSpan);
      (sectionDiv || container).appendChild(div);
    });
  }

  buildLyrics(soloLyrics, 'lyrics-solo', false);
  buildLyrics(duetLyrics, 'lyrics-duet', true);

  // --- SCROLL CONTROL ---
  let autoScroll = true;
  let lastScrollY = window.scrollY;
  const followBtn = document.getElementById('follow-btn');

  window.addEventListener('scroll', () => {
    const currentY = window.scrollY;
    if (currentY < lastScrollY - 40) {
      autoScroll = false;
      followBtn.style.display = 'block';
    }
    lastScrollY = currentY;
  }, { passive: true });

  followBtn.addEventListener('click', () => {
    autoScroll = true;
    followBtn.style.display = 'none';
    const active = document.querySelector(`#lyrics-${currentVersion} .lyric-line.active`);
    if (active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  // --- KARAOKE SYNC ---
  let currentVersion = 'solo';
  const audio = document.getElementById('player');

  audio.addEventListener('timeupdate', () => {
    const t = audio.currentTime;
    const lyrics = currentVersion === 'solo' ? soloLyrics : duetLyrics;
    const lines = document.querySelectorAll(`#lyrics-${currentVersion} .lyric-line`);
    lines.forEach((el, i) => {
      const start = lyrics[i].time;
      const end = lyrics[i + 1] ? lyrics[i + 1].time : Infinity;
      el.classList.remove('active', 'past');
      if (t >= start && t < end) {
        el.classList.add('active');
        if (autoScroll) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          lastScrollY = window.scrollY;
        }
      } else if (t >= end) {
        el.classList.add('past');
      }
    });
  });

  audio.addEventListener('seeking', () => {
    autoScroll = true;
    followBtn.style.display = 'none';
  });

  // --- VERSION TOGGLE ---
  function setVersion(v, btn) {
    currentVersion = v;
    document.querySelectorAll('.lyrics-block').forEach(b => b.classList.remove('active'));
    document.getElementById(`lyrics-${v}`).classList.add('active');
    document.querySelectorAll('.v-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('legend').style.display = v === 'duet' ? 'flex' : 'none';
    audio.src = v === 'solo' ? 'agrim-solo.mp3' : 'DuetAgrim.m4a';
    audio.load();
    audio.currentTime = 0;
    autoScroll = true;
    followBtn.style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</body>
</html>
